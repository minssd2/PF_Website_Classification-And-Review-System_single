<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{% block title %}웹사이트 분류 관리{% endblock %}</title>
	<link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
</head>
<body>
	<header>
		<h1>웹사이트 분류 관리</h1>
		<nav>
			<a href="/" class="{{ 'on' if nav == 'dashboard' }}">진행 상황</a>
			<a href="/categories" class="{{ 'on' if nav == 'categories' }}">카테고리 규칙</a>
			<a href="/settings" class="{{ 'on' if nav == 'settings' }}">판정 기준</a>
			<a href="/sites" class="{{ 'on' if nav == 'sites' }}">사이트 검수</a>
		</nav>
	</header>
	<main>
		{% block content %}{% endblock %}
	</main>
	<div id="toast" class="toast"></div>
	<script>
		function toast(message, isError) {
			const el = document.getElementById('toast');
			el.textContent = message;
			el.className = 'toast show' + (isError ? ' error' : '');
			setTimeout(() => { el.className = 'toast'; }, 3000);
		}

		async function api(url, options) {
			const res = await fetch(url, Object.assign({
				headers: { 'Content-Type': 'application/json' }
			}, options || {}));
			const data = await res.json().catch(() => ({}));
			if (!res.ok) throw new Error(data.error || ('요청 실패 (' + res.status + ')'));
			return data;
		}

		const nf = new Intl.NumberFormat('ko-KR');

		// 사이트 제목·도메인 등 수집한 값을 화면에 넣기 전에 반드시 거친다
		function escapeHtml(s) {
			return String(s == null ? '' : s).replace(/[&<>"']/g,
				ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
		}
	</script>
	{% block script %}{% endblock %}
</body>
</html>
