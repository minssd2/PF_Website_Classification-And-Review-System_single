{% extends "base.html" %}
{% block title %}판정 기준{% endblock %}

{% block content %}
<div class="hint">
	한국어 판정은 신호별 점수를 더해 <b>임계값 이상</b>이면 한국어로 봅니다.
	값을 바꾼 뒤에는 아래 <b>한국어 전량 재판정</b>을 눌러야 반영됩니다.
	크롤링 설정은 다음 <code>python run.py fetch</code> 실행부터 적용됩니다.
</div>

<div class="card">
	<h2>한국어 판정</h2>
	<table><tbody id="rows-korean"></tbody></table>
	<div class="row" style="margin-top:14px">
		<button id="btn-save-korean" class="primary">저장</button>
		<button id="btn-rejudge">저장 후 전량 재판정</button>
	</div>
</div>

<div class="card" style="margin-top:16px">
	<h2>크롤링</h2>
	<table><tbody id="rows-fetch"></tbody></table>
	<div class="row" style="margin-top:14px">
		<button id="btn-save-fetch" class="primary">저장</button>
	</div>
</div>

<div class="card" style="margin-top:16px">
	<h2>분류 · 세션 판정</h2>
	<table><tbody id="rows-classify"></tbody></table>
	<div class="row" style="margin-top:14px">
		<button id="btn-save-classify" class="primary">저장</button>
		<button id="btn-reclassify">저장 후 전체 재분류</button>
	</div>
</div>
{% endblock %}

{% block script %}
<script>
	const GROUPS = {
		korean: k => k.startsWith('korean.'),
		fetch: k => k.startsWith('fetch.'),
		classify: k => k.startsWith('classify.') || k.startsWith('llm.')
	};

	let all = [];

	function rowHtml(s) {
		// 값에 따옴표가 섞이면 속성이 깨지므로 반드시 이스케이프한다
		return `<tr>
			<td style="width:44%">
				<div>${escapeHtml(s.description || s.key)}</div>
				<div class="sub mono">${escapeHtml(s.key)}</div>
			</td>
			<td><input data-key="${escapeHtml(s.key)}"
				value="${escapeHtml(s.value == null ? '' : s.value)}" style="width:140px"></td>
		</tr>`;
	}

	async function load() {
		const r = await api('/api/settings');
		all = r.settings;
		for (const [name, test] of Object.entries(GROUPS)) {
			document.getElementById('rows-' + name).innerHTML =
				all.filter(s => test(s.key)).map(rowHtml).join('');
		}
	}

	async function save(group) {
		const values = {};
		document.querySelectorAll('#rows-' + group + ' input[data-key]')
			.forEach(el => values[el.dataset.key] = el.value.trim());
		const r = await api('/api/settings', { method: 'POST', body: JSON.stringify({ values }) });
		toast(r.updated + '개 항목이 저장되었습니다.');
	}

	document.getElementById('btn-save-korean').onclick = () => save('korean').catch(e => toast(e.message, true));
	document.getElementById('btn-save-fetch').onclick = () => save('fetch').catch(e => toast(e.message, true));
	document.getElementById('btn-save-classify').onclick = () => save('classify').catch(e => toast(e.message, true));

	document.getElementById('btn-rejudge').onclick = async () => {
		try {
			await save('korean');
			await api('/api/jobs/detect-korean?force=true', { method: 'POST' });
			toast('전량 재판정을 시작했습니다. 진행 상황 화면에서 결과를 확인하세요.');
		} catch (e) { toast(e.message, true); }
	};

	document.getElementById('btn-reclassify').onclick = async () => {
		try {
			await save('classify');
			await api('/api/jobs/classify-rule?force=true', { method: 'POST' });
			toast('전체 재분류를 시작했습니다. 진행 상황 화면에서 결과를 확인하세요.');
		} catch (e) { toast(e.message, true); }
	};

	load();
</script>
{% endblock %}
