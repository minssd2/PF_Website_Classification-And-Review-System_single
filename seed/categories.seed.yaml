# 카테고리 규칙 초기값 — `run.py init` 이 DB(category_rules)에 주입한다.
# 주입 이후의 수정은 웹 UI(/categories)에서 하며, 이 파일은 다시 읽지 않는다.
#
# rule_type
#   domain  : 도메인 매칭. 패턴에 '*' 가 있으면 와일드카드, '.' 이 있으면 부분일치,
#             그 외에는 도메인 라벨 토큰과 정확히 일치할 때만 매칭 (ai 가 mail 에 걸리는 오탐 방지)
#   keyword : title / description / 본문 발췌에 대한 부분일치 (대소문자 무시)
#   exclude : 매칭되면 해당 카테고리 점수를 0으로 만든다
#
# weight 관례: 서비스 확정 도메인 3.0 / 일반 토큰 1.5 / 키워드 1.0

